<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মেস মিল কাউন্টার</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .container { max-width: 480px; margin: auto; }
    h2 { text-align: center; margin-bottom: 6px; color: #38bdf8; }
    .status { text-align: center; font-size: 12px; color: #94a3b8; margin-bottom: 16px; }
    .summary { display: flex; gap: 12px; margin-bottom: 20px; }
    .card { flex: 1; background: #1e293b; padding: 14px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
    .card span { display: block; font-size: 13px; color: #94a3b8; }
    .card strong { font-size: 32px; color: #22c55e; }
    .add-box { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px; }
    button.add-btn { padding: 10px 18px; border: none; border-radius: 8px; background: #0ea5e9; color: #fff; font-weight: bold; cursor: pointer; }
    .member { display: flex; align-items: center; justify-content: space-between; background: #1e293b; padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #334155; }
    .m-name { font-weight: 600; font-size: 16px; word-break: break-word; padding-right: 8px; }
    .controls { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .toggle-wrap { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #94a3b8; gap: 4px; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #475569; border-radius: 24px; transition: .25s; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .25s; }
    input:checked + .slider { background: #22c55e; }
    input:checked + .slider:before { transform: translateX(20px); }
    .del-btn { background: transparent; border: none; color: #ef4444; font-size: 18px; cursor: pointer; padding: 4px 6px; }
    .empty { text-align: center; color: #64748b; padding: 24px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h2>মেস মিল কাউন্টার</h2>
    <div class="status" id="statusText">ডাটাবেসে কানেক্ট হচ্ছে...</div>

    <div class="summary">
      <div class="card"><span>সকাল (Sokal)</span><strong id="mCount">0</strong></div>
      <div class="card"><span>রাত (Rat)</span><strong id="nCount">0</strong></div>
    </div>

    <div class="add-box">
      <input type="text" id="newName" placeholder="নতুন মেম্বারের নাম লিখুন...">
      <button class="add-btn" id="addBtn">অ্যাড</button>
    </div>

    <div id="memberList" class="empty">লোড হচ্ছে...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, remove, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDqNuWAahjlxf6GCrLSAHz0JGdvKd0SM8E",
      authDomain: "meal-display.firebaseapp.com",
      databaseURL: "https://meal-display-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "meal-display",
      storageBucket: "meal-display.firebasestorage.app",
      messagingSenderId: "613804844464",
      appId: "1:613804844464:web:1d1d261c47cd25b134a275"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const membersRef = ref(db, "members");
    const summaryRef = ref(db, "summary");

    const listEl = document.getElementById("memberList");
    const mCountEl = document.getElementById("mCount");
    const nCountEl = document.getElementById("nCount");
    const statusEl = document.getElementById("statusText");
    const newNameInput = document.getElementById("newName");
    const addBtn = document.getElementById("addBtn");

    async function syncSummary() {
      const snap = await get(membersRef);
      const data = snap.val() || {};
      let morning = 0, night = 0;
      Object.values(data).forEach(m => {
        if (m.morning) morning++;
        if (m.night) night++;
      });
      await set(summaryRef, { morning, night });
    }

    onValue(membersRef, (snapshot) => {
      statusEl.textContent = "● অনলাইন (লাইভ সিঙ্ক)";
      statusEl.style.color = "#22c55e";
      const data = snapshot.val();
      listEl.innerHTML = "";

      if (!data) {
        mCountEl.textContent = "0";
        nCountEl.textContent = "0";
        listEl.innerHTML = '<div class="empty">কোনো মেম্বার নেই। ওপর থেকে নাম অ্যাড করুন।</div>';
        return;
      }

      let mTotal = 0, nTotal = 0;
      Object.entries(data).forEach(([key, member]) => {
        if (member.morning) mTotal++;
        if (member.night) nTotal++;

        const row = document.createElement("div");
        row.className = "member";

        const nameDiv = document.createElement("div");
        nameDiv.className = "m-name";
        nameDiv.textContent = member.name;

        const controls = document.createElement("div");
        controls.className = "controls";
        controls.innerHTML = `
          <div class="toggle-wrap">
            <span>সকাল</span>
            <label class="switch">
              <input type="checkbox" data-key="${key}" data-type="morning" ${member.morning ? "checked" : ""}>
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-wrap">
            <span>রাত</span>
            <label class="switch">
              <input type="checkbox" data-key="${key}" data-type="night" ${member.night ? "checked" : ""}>
              <span class="slider"></span>
            </label>
          </div>
          <button class="del-btn" data-del="${key}" title="রিমুভ">✕</button>
        `;

        row.appendChild(nameDiv);
        row.appendChild(controls);
        listEl.appendChild(row);
      });

      mCountEl.textContent = mTotal;
      nCountEl.textContent = nTotal;
    }, (error) => {
      statusEl.textContent = "কানেকশন এরর (Firebase Rules চেক করুন): " + error.message;
      statusEl.style.color = "#ef4444";
    });

    async function addMember() {
      const name = newNameInput.value.trim();
      if (!name) return;
      newNameInput.value = "";
      await push(membersRef, { name, morning: true, night: true });
      await syncSummary();
    }

    addBtn.addEventListener("click", addMember);
    newNameInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") addMember();
    });

    listEl.addEventListener("change", async (e) => {
      if (e.target.matches('input[type="checkbox"]')) {
        const key = e.target.dataset.key;
        const type = e.target.dataset.type;
        await update(ref(db, `members/${key}`), { [type]: e.target.checked });
        await syncSummary();
      }
    });

    listEl.addEventListener("click", async (e) => {
      if (e.target.matches(".del-btn")) {
        const key = e.target.dataset.del;
        if (!confirm("এই মেম্বারকে লিস্ট থেকে বাদ দিতে চান?")) return;
        await remove(ref(db, `members/${key}`));
        await syncSummary();
      }
    });
  </script>
</body>
</html>
